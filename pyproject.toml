[tool.uv.workspace]
members = [
    "api",
    "core",
    "integrations/email_smtp",
    "integrations/email_stub",
    "integrations/followupboss",
    "integrations/google_drive",
    "integrations/google_oidc",
    "integrations/llm_extraction",
    "integrations/mls_reso",
    "integrations/pydantic_ai_extraction",
    "integrations/sierra_crm",
    "integrations/vapi",
    "orchestration/adk",
    "orchestration/langgraph",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["api/alembic"]

[tool.mypy]
strict = true
# api/tests and orchestration/langgraph/tests each ship a conftest.py; mypy's rootless
# module resolution would otherwise see them as one duplicate "conftest" module. The api
# one is a few lines of env setup with nothing to type-check, so exclude it from mypy
# (pytest still imports it); the langgraph conftest stays checked.
exclude = ['api/tests/conftest\.py$']

[tool.pytest.ini_options]
testpaths = [
    "api/tests",
    "core/tests",
    "integrations/email_smtp/tests",
    "integrations/email_stub/tests",
    "integrations/followupboss/tests",
    "integrations/google_drive/tests",
    "integrations/google_oidc/tests",
    "integrations/llm_extraction/tests",
    "integrations/mls_reso/tests",
    "integrations/pydantic_ai_extraction/tests",
    "integrations/sierra_crm/tests",
    "integrations/vapi/tests",
    "orchestration/adk/tests",
    "orchestration/langgraph/tests",
]
asyncio_mode = "auto"
