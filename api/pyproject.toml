[project]
name = "brokerops-api"
version = "0.1.0"
description = "brokerops API service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "brokerops-adk",
    "brokerops-core",
    "brokerops-email-smtp",
    "brokerops-followupboss",
    "brokerops-google-oidc",
    "brokerops-langgraph",
    "brokerops-llm-extraction",
    "brokerops-mls-reso",
    "brokerops-vapi",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.uv.sources]
brokerops-adk = { workspace = true }
brokerops-core = { workspace = true }
brokerops-email-smtp = { workspace = true }
brokerops-followupboss = { workspace = true }
brokerops-google-oidc = { workspace = true }
brokerops-langgraph = { workspace = true }
brokerops-llm-extraction = { workspace = true }
brokerops-mls-reso = { workspace = true }
brokerops-vapi = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
