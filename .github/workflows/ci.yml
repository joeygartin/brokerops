name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brokerops
          POSTGRES_PASSWORD: brokerops
          POSTGRES_DB: brokerops_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U brokerops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://brokerops:brokerops@localhost:5432/brokerops_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >
          uv run mypy api/src api/tests core/src core/tests
          integrations/mls_reso/src integrations/mls_reso/tests
          integrations/followupboss/src integrations/followupboss/tests
          integrations/vapi/src integrations/vapi/tests
          orchestration/langgraph/src orchestration/langgraph/tests
      - run: uv run pytest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-demo:
    # The full demo path against the real compose stack — main only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: wait for api
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && exit 0 || sleep 2
          done
          docker compose logs api | tail -50
          exit 1
      - run: scripts/e2e_demo_check.sh
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v
