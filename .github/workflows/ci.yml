name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brokerops
          POSTGRES_PASSWORD: brokerops
          POSTGRES_DB: brokerops_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U brokerops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://brokerops:brokerops@localhost:5432/brokerops_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >
          uv run mypy api/src api/tests core/src core/tests
          integrations/email_smtp/src integrations/email_smtp/tests
          integrations/mls_reso/src integrations/mls_reso/tests
          integrations/followupboss/src integrations/followupboss/tests
          integrations/google_drive/src integrations/google_drive/tests
          integrations/google_oidc/src integrations/google_oidc/tests
          integrations/llm_extraction/src integrations/llm_extraction/tests
          integrations/pydantic_ai_extraction/src integrations/pydantic_ai_extraction/tests
          integrations/vapi/src integrations/vapi/tests
          orchestration/langgraph/src orchestration/langgraph/tests
          orchestration/adk/src orchestration/adk/tests
      - run: uv run pytest

  frontend:
    # Type-check, production build, and the vitest unit suite for the
    # role-aware operator console.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Full-history scan with a pinned binary (gitleaks-action@v2 computes a
      # parent-relative range that breaks on a repo's initial push).
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --verbose .

  e2e-demo:
    # The full demo path against the real compose stack — main only.
    # The check itself is framework-blind; the matrix proves both
    # orchestration engines behind the same script, unchanged.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        orchestrator: [langgraph, adk]
    env:
      ORCHESTRATOR: ${{ matrix.orchestrator }}
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up -d --build
      - name: wait for api
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && exit 0 || sleep 2
          done
          docker compose logs api | tail -50
          exit 1
      - run: scripts/e2e_demo_check.sh
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v
