name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brokerops
          POSTGRES_PASSWORD: brokerops
          POSTGRES_DB: brokerops_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U brokerops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://brokerops:brokerops@localhost:5432/brokerops_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >
          uv run mypy api/src api/tests core/src core/tests
          integrations/mls_reso/src integrations/mls_reso/tests
          integrations/followupboss/src integrations/followupboss/tests
          orchestration/langgraph/src orchestration/langgraph/tests
      - run: uv run pytest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
