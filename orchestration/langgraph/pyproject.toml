[project]
name = "brokerops-langgraph"
version = "0.1.0"
description = "brokerops V1 orchestration — LangGraph graphs over the core domain"
requires-python = ">=3.12"
dependencies = [
    "brokerops-core",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
brokerops-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brokerops_langgraph"]
