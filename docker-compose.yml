services:
  db:
    image: postgres:16-alpine
    environment:
      # Demo-only credentials — client deploys use Cloud SQL + Secret Manager.
      POSTGRES_USER: brokerops
      POSTGRES_PASSWORD: brokerops
      POSTGRES_DB: brokerops_demo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerops"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
