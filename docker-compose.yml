services:
  db:
    image: postgres:16-alpine
    environment:
      # Demo-only credentials — client deploys use Cloud SQL + Secret Manager.
      POSTGRES_USER: brokerops
      POSTGRES_PASSWORD: brokerops
      POSTGRES_DB: brokerops_demo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerops"]
      interval: 5s
      timeout: 3s
      retries: 10

  mls:
    build:
      context: .
      dockerfile: integrations/mls_reso/Dockerfile
    ports:
      - "8001:8001"

  fub:
    build:
      context: .
      dockerfile: integrations/followupboss/Dockerfile
    ports:
      - "8002:8002"

  vapi:
    build:
      context: .
      dockerfile: integrations/vapi/Dockerfile
    environment:
      # The stub fires end-of-call webhooks at the api, like real Vapi does.
      WEBHOOK_URL: http://api:8000/webhooks/vapi
      VAPI_WEBHOOK_SECRET: demo-webhook-secret
    ports:
      - "8003:8003"

  drive:
    build:
      context: .
      dockerfile: integrations/google_drive/Dockerfile
    environment:
      # webViewLinks must resolve from the operator's browser, not the compose
      # network, so the stub advertises its host-published address.
      DRIVE_STUB_PUBLIC_URL: http://localhost:8004
    ports:
      - "8004:8004"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      # Orchestration engine (ADR-0019): langgraph is the sole engine. The
      # selector stays fail-loud — any other value refuses to start.
      ORCHESTRATOR: ${ORCHESTRATOR:-langgraph}
      # Every integration interpolates from the environment (or a gitignored
      # .env) with the bundled stub as the default — `docker compose up` stays
      # zero-credential, and a .env flips any integration to its real
      # counterpart with no file edits (see .env.example).
      RESO_BASE_URL: ${RESO_BASE_URL:-http://mls:8001/odata}
      RESO_AUTH_TOKEN: ${RESO_AUTH_TOKEN:-}
      DATABASE_URL: postgresql://brokerops:brokerops@db:5432/brokerops_demo
      FUB_BASE_URL: ${FUB_BASE_URL:-http://fub:8002}
      FUB_API_KEY: ${FUB_API_KEY:-demo-stub-key}
      VAPI_BASE_URL: ${VAPI_BASE_URL:-http://vapi:8003}
      VAPI_API_KEY: ${VAPI_API_KEY:-demo-stub-key}
      # Office files: explicit closed selector (BOP-021). stub = the bundled
      # in-memory Drive double (zero credentials); google_drive needs a real
      # service-account file and fails loud without one.
      FILES_PROVIDER: ${FILES_PROVIDER:-stub}
      GOOGLE_DRIVE_BASE_URL: ${GOOGLE_DRIVE_BASE_URL:-http://drive:8004}
      VAPI_ASSISTANT_ID: ${VAPI_ASSISTANT_ID:-demo-assistant}
      VAPI_PHONE_NUMBER_ID: ${VAPI_PHONE_NUMBER_ID:-}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET:-demo-webhook-secret}
      # Feedback extraction: explicit closed selector (ADR-0014). Unset =
      # deterministic (zero-credential demo); set EXTRACTION_BACKEND to llm or
      # pydantic_ai plus a real LLM_API_KEY to flip backends. LLM_MODEL unset
      # falls back to the selected backend's default.
      EXTRACTION_BACKEND: ${EXTRACTION_BACKEND:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Outbound business email: explicit closed selector (ADR-0015). Unset =
      # the bundled in-process stub (zero-credential demo). Every closed
      # selector the api reads MUST be passed through here, or a .env value
      # would be silently ignored inside the container — the exact silent
      # downgrade the fail-loud selectors exist to prevent (parity is pinned
      # by api/tests/test_compose_selector_parity.py).
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-}
      # SES companion config (BOP-016): only read when EMAIL_PROVIDER=ses.
      SES_REGION: ${SES_REGION:-}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID:-}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY:-}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-}
      SES_BASE_URL: ${SES_BASE_URL:-}
      # SendGrid companion config (BOP-017): only read when EMAIL_PROVIDER=
      # sendgrid, which fails loud without a real key + sender identity.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_BASE_URL: ${SENDGRID_BASE_URL:-}
      # Outbound SMS: EMAIL_PROVIDER's sibling selector (BOP-018). Unset = the
      # bundled in-process Twilio-shaped stub (zero-credential demo). The
      # delivery-status webhook fails closed without TWILIO_AUTH_TOKEN, so
      # compose defaults a demo signing token (the VAPI_WEBHOOK_SECRET pattern).
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      # Outbound-message drafting (BOP-019): explicit closed selector. Unset =
      # deterministic template rendering; llm fails loud until BOP-020.
      DRAFTING_BACKEND: ${DRAFTING_BACKEND:-}
      SMS_BASE_URL: ${SMS_BASE_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-demo-twilio-token}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      # Demo seed/reset routes (/demo/*): on for the local demo so the "Seed demo
      # transactions" button works; off by default everywhere else (the route can wipe
      # tenant data). Real client deploys never set this.
      ENABLE_DEMO_ROUTES: ${ENABLE_DEMO_ROUTES:-true}
      # Operator auth: no methods = demo operator, no login (ADR-0007/0008).
      # AUTH_METHODS picks google and/or magic; magic needs a session key + the
      # public frontend URL, and logs links to this console without SMTP.
      AUTH_METHODS: ${AUTH_METHODS:-}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      AUTH_ALLOWED_DOMAIN: ${AUTH_ALLOWED_DOMAIN:-}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-no-reply@brokerops.app}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-brokerops-local}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mls:
        condition: service_started
      fub:
        condition: service_started
      vapi:
        condition: service_started
      drive:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
