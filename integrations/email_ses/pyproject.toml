[project]
name = "brokerops-email-ses"
version = "0.1.0"
description = "Amazon SES email provider: EmailPort adapter + MCP server + recorded-shape stub"
requires-python = ">=3.12"
dependencies = [
    "brokerops-core",
    "fastapi>=0.115",
    "httpx>=0.28",
    "mcp>=1.2",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
mcp-server-email-ses = "brokerops_email_ses.mcp_server:main"

[tool.uv.sources]
brokerops-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
