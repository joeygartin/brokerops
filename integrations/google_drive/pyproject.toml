[project]
name = "brokerops-google-drive"
version = "0.1.0"
description = "Google Drive files adapter + MCP server + demo-mode stub"
requires-python = ">=3.12"
dependencies = [
    "brokerops-core",
    "fastapi>=0.115",
    "google-auth>=2.0",
    "httpx>=0.28",
    "mcp>=1.2",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
mcp-server-google-drive = "brokerops_google_drive.mcp_server:main"

[tool.uv.sources]
brokerops-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
