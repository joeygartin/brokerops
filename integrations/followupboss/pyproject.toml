[project]
name = "brokerops-followupboss"
version = "0.1.0"
description = "FollowUpBoss CRM adapter + MCP server + demo-mode stub"
requires-python = ">=3.12"
dependencies = [
    "brokerops-core",
    "fastapi>=0.115",
    "httpx>=0.28",
    "mcp>=1.2",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
mcp-server-followupboss = "brokerops_followupboss.mcp_server:main"

[tool.uv.sources]
brokerops-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
