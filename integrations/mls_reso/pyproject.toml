[project]
name = "brokerops-mls-reso"
version = "0.1.0"
description = "Mock RESO Web API (OData subset) + MLSPort adapter + MCP server"
requires-python = ">=3.12"
dependencies = [
    "brokerops-core",
    "fastapi>=0.115",
    "httpx>=0.28",
    "mcp>=1.2",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
mcp-server-mls-reso = "brokerops_mls_reso.mcp_server:main"

[tool.uv.sources]
brokerops-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
