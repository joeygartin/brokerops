[project]
name = "brokerops-pydantic-ai-drafting"
version = "0.1.0"
description = "DraftingPort adapter backed by a PydanticAI agent"
requires-python = ">=3.12"
dependencies = [
    "brokerops-core",
    # Pinned to a known-good minor, matching pydantic_ai_extraction: PydanticAI
    # moves fast — two majors in ten months — and its 3-month no-break window is
    # shorter than this repo's upgrade cadence.
    "pydantic-ai-slim[anthropic]~=2.3.0",
]

[tool.uv.sources]
brokerops-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
